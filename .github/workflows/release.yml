name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build release archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          targets="
          linux/amd64
          linux/arm64
          linux/arm/7
          darwin/amd64
          darwin/arm64
          windows/amd64
          windows/arm64
          "
          for target in $targets; do
            IFS=/ read -r goos goarch goarm <<< "$target"
            suffix="${goos}_${goarch}"
            if [ "${goarm:-}" != "" ]; then suffix="${suffix}v${goarm}"; fi
            work="dist/work/${suffix}"
            mkdir -p "$work"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="${goarm:-}" go build -trimpath -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "${work}/aimilivpn${ext}" ./cmd/aimilivpn
            env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="${goarm:-}" go build -trimpath -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "${work}/aimilivpnctl${ext}" ./cmd/aimilivpnctl
            cp README.md LICENSE "$work/"
            tar -C "$work" -czf "dist/aimilivpn_${version}_${suffix}.tar.gz" .
            tar -C "$work" -czf "dist/aimilivpn_${suffix}.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "AimiliVPN ${GITHUB_REF_NAME}" \
            --notes "Automated AimiliVPN release for ${GITHUB_REF_NAME}."

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
